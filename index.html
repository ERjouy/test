<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page de test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, .35);
    }
    h1 { font-size: 1.6rem; margin-bottom: .5rem; }
    p { color: #94a3b8; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: #3b82f6;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: .7rem 1.2rem;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    #compteur { margin-top: 1rem; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Page de test</h1>
    <p>Ceci est une page HTML de test. Le bouton ci-dessous incrémente un compteur pour vérifier que JavaScript fonctionne.</p>
    <button id="btn">Cliquer</button>
    <div id="compteur">Clics : 0</div>
  </main>

  <script>
    let clics = 0;
    const btn = document.getElementById('btn');
    const compteur = document.getElementById('compteur');
    btn.addEventListener('click', () => {
      clics++;
      compteur.textContent = 'Clics : ' + clics;
    });
  </script>
</body>
</html>
